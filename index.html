<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IRIS AI – Techdemo</title>
<style>
:root{--c:#00e5ff;--bg:#05080d;--tx:#e8f7ff;--glass:rgba(10,25,35,.45);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#05080d}}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;overflow:hidden}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#fake{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 85%,#2a4a63 0,#0f1b28 45%,#05080d 100%)}
#fake::before{content:"";position:absolute;left:50%;bottom:0;width:140%;height:55%;transform:translateX(-50%) perspective(300px) rotateX(55deg);background:repeating-linear-gradient(90deg,transparent 0 48px,rgba(0,229,255,.08) 48px 50px),repeating-linear-gradient(0deg,transparent 0 48px,rgba(0,229,255,.08) 48px 50px)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 38%,rgba(0,0,0,.75) 72%,#000 100%)}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,229,255,.035) 0 1px,transparent 1px 3px)}
#scan::after{content:"";position:absolute;left:0;right:0;height:90px;background:linear-gradient(transparent,rgba(0,229,255,.12),transparent);animation:sweep 5s linear infinite}
@keyframes sweep{from{top:-90px}to{top:100%}}
.reticle{position:absolute;left:50%;top:44%;width:min(70vw,340px);aspect-ratio:1;transform:translate(-50%,-50%);opacity:.55;pointer-events:none}
.reticle svg{position:absolute;inset:0;width:100%;height:100%}
.r1{animation:spin 18s linear infinite}.r2{animation:spin 11s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:18px;right:18px;display:flex;justify-content:space-between;font-size:14px;letter-spacing:.08em;text-shadow:0 0 8px var(--c)}
.top b{font-size:26px;font-weight:300;display:block;font-variant-numeric:tabular-nums}
.card{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(0,229,255,.45);border-radius:16px;padding:14px 16px;box-shadow:0 0 18px rgba(0,229,255,.25),inset 0 0 18px rgba(0,229,255,.06)}
.mode{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .6s}
.mode.on{opacity:1}
.lbl{font-size:11px;letter-spacing:.2em;color:var(--c);text-transform:uppercase;margin-bottom:6px}
#boot{pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000;z-index:5;transition:opacity .8s}
#boot.off{opacity:0;pointer-events:none}
#boot h1{font-weight:200;letter-spacing:.5em;font-size:34px;text-shadow:0 0 16px var(--c)}
.bar{width:60%;height:3px;background:rgba(0,229,255,.2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--c);box-shadow:0 0 10px var(--c)}
#boot p{font-size:12px;letter-spacing:.2em;color:var(--c)}
.go{margin-top:10px;padding:12px 26px;border:1px solid var(--c);border-radius:30px;background:transparent;color:var(--c);font-size:13px;letter-spacing:.2em}
/* nav */
.nav1{position:absolute;top:calc(env(safe-area-inset-top,0px) + 80px);left:18px;display:flex;gap:12px;align-items:center}
.nav1 .big{font-size:34px;font-weight:300;font-variant-numeric:tabular-nums}
.path{position:absolute;left:50%;bottom:150px;width:150px;height:200px;transform:translateX(-50%);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}
.path i{width:0;height:0;border-left:var(--w) solid transparent;border-right:var(--w) solid transparent;border-bottom:calc(var(--w)*.7) solid var(--c);filter:drop-shadow(0 0 8px var(--c));opacity:.2;animation:flow 1.4s infinite}
@keyframes flow{0%,100%{opacity:.15}50%{opacity:1}}
.meet{position:absolute;right:18px;top:46%;max-width:46%}
.speed{position:absolute;left:22px;bottom:130px;font-size:38px;font-weight:300}.speed small{font-size:12px;display:block;letter-spacing:.1em}
/* trans */
.tcard{position:absolute;left:16px;right:16px;bottom:140px;transform:perspective(700px) rotateX(4deg)}
.en{font-size:19px;opacity:.75;min-height:26px}.de{font-size:26px;font-weight:600;min-height:34px;margin-top:6px;text-shadow:0 0 10px rgba(0,229,255,.5)}
.wave{display:flex;gap:3px;align-items:center;height:20px;margin-top:10px}.wave i{width:3px;background:var(--c);border-radius:2px;animation:w .9s infinite ease-in-out}
@keyframes w{0%,100%{height:4px}50%{height:18px}}
.chip{position:absolute;left:16px;top:42%;font-size:13px}
.chip b{display:block;font-size:11px;letter-spacing:.15em;color:var(--c)}
/* health */
.hcard{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 90px);display:grid;gap:10px}
.row{display:grid;grid-template-columns:44px 1fr 110px;align-items:center;gap:10px}
.row .v{font-size:28px;font-weight:300;font-variant-numeric:tabular-nums}.row small{font-size:13px;opacity:.7}
.row svg{width:100%;height:36px}.row polyline{fill:none;stroke:var(--c);stroke-width:2;filter:drop-shadow(0 0 4px var(--c))}
.run{position:absolute;left:16px;right:16px;bottom:140px;display:flex;justify-content:space-around;font-size:18px}
/* tabs */
.tabs{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:6px;z-index:4}
.tabs button{flex:1;padding:12px 4px;border-radius:14px;border:1px solid rgba(0,229,255,.3);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--tx);font-size:12px;letter-spacing:.06em}
.tabs button.on{border-color:var(--c);color:var(--c);box-shadow:0 0 14px rgba(0,229,255,.4)}
.tag{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);text-align:center;font-size:10px;letter-spacing:.3em;opacity:.55}
</style>
</head>
<body>
<video id="bg" autoplay playsinline muted></video>
<div id="fake"></div>
<div id="vig"></div><div id="scan"></div>
<div class="reticle">
<svg class="r1" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#00e5ff" stroke-width=".6" stroke-dasharray="2 3"/><path d="M50 2v8M50 90v8M2 50h8M90 50h8" stroke="#00e5ff" stroke-width=".8"/></svg>
<svg class="r2" viewBox="0 0 100 100"><circle cx="50" cy="50" r="36" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="40 14 8 14"/></svg>
<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="2" fill="#00e5ff"/></svg>
</div>
<div class="top"><div>17:24<b id="clock">17:24</b></div><div style="text-align:right">☀ 18 °C<b id="batt">92 %</b></div></div>

<section class="mode" id="m-nav">
<div class="card nav1"><div style="font-size:38px">↑</div><div><div class="lbl" style="margin:0">Navigation</div><div class="big"><span id="dist">300</span> m</div><div>Hauptbahnhof</div></div></div>
<div class="card meet"><div class="lbl">Kalender</div>Meeting in 36 min<br><small style="opacity:.7">Büro, 2. OG</small></div>
<div class="path" id="path"></div>
<div class="speed"><span id="spd">32</span><small>km/h</small></div>
</section>

<section class="mode" id="m-tr">
<div class="card chip"><b>LIVE-TEXT</b>Café Central · Menü</div>
<div class="card tcard"><div class="lbl">Englisch → Deutsch · Echtzeit</div><div class="en" id="en"></div><div class="de" id="de"></div><div class="wave" id="wave"></div></div>
</section>

<section class="mode" id="m-h">
<div class="card hcard">
<div class="row"><span style="font-size:30px">♡</span><div><div class="v"><span id="hr">72</span> <small>bpm</small></div></div><svg viewBox="0 0 100 36"><polyline id="l1"/></svg></div>
<div class="row"><span style="font-size:30px">💧</span><div><div class="v"><span id="ox">98</span> <small>%</small></div></div><svg viewBox="0 0 100 36"><polyline id="l2"/></svg></div>
<div class="row"><span style="font-size:30px">🌡</span><div><div class="v"><span id="tp">36,6</span> <small>°C</small></div></div><svg viewBox="0 0 100 36"><polyline id="l3"/></svg></div>
</div>
<div class="card run"><span>🏃 <span id="km">5,2</span> km</span><span>⏱ <span id="tm">24:18</span></span></div>
</section>

<div class="tag">IRIS AI · VISION 2.0 · PROTOTYP-SIMULATION</div>
<div class="tabs" id="tabs"><button data-m="nav">Navigation</button><button data-m="tr">Übersetzen</button><button data-m="h">Health</button><button id="flip">⟲ Kamera</button><button id="auto">⏵ Auto</button></div>

<div class="mode on" id="boot">
<h1>IRIS</h1><p id="bt">IRIS WIRD INITIALISIERT …</p><div class="bar"><i id="bi"></i></div>
<button class="go" id="cam">MIT KAMERA STARTEN</button>
<button class="go" id="nocam" style="border-color:#456;color:#9ab">OHNE KAMERA</button>
</div>

<script>
var $=function(s){return document.querySelector(s)};
var modes=['nav','tr','h'],cur='nav',auto=true,timer=null;
// path chevrons
var p=$('#path');for(var i=0;i<5;i++){var e=document.createElement('i');e.style.setProperty('--w',(70-i*11)+'px');e.style.animationDelay=(i*0.18)+'s';p.appendChild(e)}
var w=$('#wave');for(var j=0;j<24;j++){var b=document.createElement('i');b.style.animationDelay=(Math.random()*.9)+'s';w.appendChild(b)}
function show(m){cur=m;modes.forEach(function(x){$('#m-'+x).classList.toggle('on',x===m)});
 document.querySelectorAll('#tabs [data-m]').forEach(function(b){b.classList.toggle('on',b.dataset.m===m)});
 if(navigator.vibrate)navigator.vibrate(15);
 if(m==='tr')startTrans();}
function next(){show(modes[(modes.indexOf(cur)+1)%3])}
function sched(){clearInterval(timer);if(auto)timer=setInterval(next,14000)}
document.querySelectorAll('#tabs [data-m]').forEach(function(b){b.onclick=function(){auto=false;$('#auto').textContent='⏵ Auto';sched();show(b.dataset.m)}});
$('#auto').onclick=function(){auto=!auto;this.textContent=auto?'⏸ Auto':'⏵ Auto';sched();if(auto)next()};
// clock
setInterval(function(){var d=new Date();$('#clock').textContent=d.toTimeString().slice(0,5)},1000);$('#clock').textContent=new Date().toTimeString().slice(0,5);
// nav sim
var dist=300;setInterval(function(){dist-=3;if(dist<20)dist=300;$('#dist').textContent=dist;$('#spd').textContent=30+Math.round(Math.random()*4)},400);
// translation script
var lines=[["Good morning! Did you sleep well?","Guten Morgen! Gut geschlafen?"],["The meeting starts at ten.","Das Meeting beginnt um zehn."],["Shall we get a coffee first?","Wollen wir erst einen Kaffee holen?"],["I’ll send you the report today.","Ich schicke dir den Bericht heute."]];
var tt=null;
function type(el,txt,cb){var i=0;el.textContent='';clearInterval(tt);tt=setInterval(function(){el.textContent=txt.slice(0,++i);if(i>=txt.length){clearInterval(tt);cb&&setTimeout(cb,350)}},35)}
var li=0,tgen=0;
function startTrans(){var g=++tgen;li=0;(function step(){if(g!==tgen||cur!=='tr')return;var L=lines[li%lines.length];$('#de').textContent='';
 type($('#en'),L[0],function(){if(g!==tgen)return;type($('#de'),L[1],function(){li++;setTimeout(step,1800)})})})()}
// health sim
var data=[[],[],[]];function spark(id,arr,min,max){var pts=arr.map(function(v,i){return (i*100/29)+','+(34-(v-min)/(max-min)*32)}).join(' ');$(id).setAttribute('points',pts)}
for(var k=0;k<30;k++){data[0].push(72);data[1].push(98);data[2].push(36.6)}
var sec=1458;
setInterval(function(){
 var hr=72+Math.round(Math.sin(Date.now()/900)*5+Math.random()*3);var ox=97+Math.round(Math.random()*2);var tp=36.5+Math.random()*.2;
 [hr,ox,tp].forEach(function(v,i){data[i].push(v);data[i].shift()});
 $('#hr').textContent=hr;$('#ox').textContent=ox;$('#tp').textContent=tp.toFixed(1).replace('.',',');
 spark('#l1',data[0],60,85);spark('#l2',data[1],95,100);spark('#l3',data[2],36.3,36.9);
 sec++;$('#tm').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');$('#km').textContent=(5.2+(sec-1458)*0.0028).toFixed(1).replace('.',',');
 $('#batt').textContent='92 %';},600);
// boot
function boot(){var bi=$('#bi'),t=0,msgs=['SENSOREN KALIBRIEREN …','KI-MODELL LADEN …','VERBINDUNG HERGESTELLT'];
 var iv=setInterval(function(){t+=2;bi.style.width=t+'%';$('#bt').textContent=msgs[Math.min(2,Math.floor(t/34))];if(t>=100){clearInterval(iv);setTimeout(function(){$('#boot').classList.add('off');show('nav');sched()},500)}},45)}
var face='environment',stream=null;
function note(t){$('.tag').textContent=t}
function startCam(f){face=f;if(stream)stream.getTracks().forEach(function(t){t.stop()});
 navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:f}},audio:false}).catch(function(){return navigator.mediaDevices.getUserMedia({video:true,audio:false})}).then(function(s){stream=s;var v=$('#bg');v.srcObject=s;v.style.display='block';$('#fake').style.display='none';v.play();note('IRIS AI · LIVE-KAMERA AKTIV')}).catch(function(){note('KAMERA GESPERRT – SEITE DIREKT IN SAFARI ÖFFNEN')})}
function begin(useCam){$('#cam').style.display=$('#nocam').style.display='none';
 if(useCam&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
  startCam('environment');}else if(useCam){note('KAMERA NICHT VERFÜGBAR – SAFARI NUTZEN')}
 boot()}
$('#cam').onclick=function(){begin(true)};$('#nocam').onclick=function(){begin(false)};
$('#auto').textContent='⏸ Auto';
$('#flip').onclick=function(){if(stream)startCam(face==='environment'?'user':'environment')};
</script>
</body>
</html>
